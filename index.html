<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive TCGA/SEER ΔIBS spaghetti plots</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
  }
  .wrap {
    max-width: 1520px;
    margin: 0 auto;
    padding: 14px 22px 26px;
  }
  .toolbar {
    display: grid;
    grid-template-columns: minmax(290px, 430px) 1fr;
    gap: 14px;
    align-items: start;
    margin-bottom: 8px;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    background: var(--panel);
  }
  .label {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  select,
  input[type="search"] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    background: white;
  }
  .button-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 9px;
  }
  button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: #9ca3af; }
  .cancer-panel {
    max-height: 142px;
    overflow: auto;
  }
  .cancer-grid {
    display: grid;
    grid-template-columns: repeat(11, minmax(70px, 1fr));
    gap: 4px 9px;
    margin-top: 8px;
  }
  .cancer-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    white-space: nowrap;
  }
  .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.25);
    display: inline-block;
    flex: none;
  }
  .minor {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.35;
    margin-top: 6px;
  }
  #plot {
    width: 100%;
    height: 820px;
  }
  @media (max-width: 1050px) {
    .toolbar { grid-template-columns: 1fr; }
    .cancer-grid { grid-template-columns: repeat(4, minmax(70px, 1fr)); }
    #plot { height: 760px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <div class="card">
      <div class="label">Scenario</div>
      <select id="scenarioSelect"></select>
      <div class="button-row">
        <button id="selectAll">Select all cancers</button>
        <button id="clearAll">Clear all</button>
        <button id="focusFour">BRCA/SKCM/LUSC/LAML</button>
      </div>
      <div class="minor">
        The plot uses the same categorical x-axis and ΔIBS construction as the static spaghetti figures.
        Missing intermediate cancer/regime points are line-filled exactly as in the Matplotlib plotting script.
      </div>
    </div>

    <div class="card cancer-panel">
      <div class="label">Cancer traces</div>
      <input type="search" id="searchCancer" placeholder="Filter cancers..." />
      <div id="cancerList" class="cancer-grid"></div>
    </div>
  </div>

  <div id="plot"></div>
</div>

const DEFAULT_FOCUS = new Set(["BRCA", "SKCM", "LUSC", "LAML"]);
let selectedCancers = new Set(DATA.cancers);

const scenarioSelect = document.getElementById("scenarioSelect");
const cancerList = document.getElementById("cancerList");
const searchCancer = document.getElementById("searchCancer");

function scenarioById(id) {
  return DATA.scenarios.find(s => s.scenario === id);
}

function initScenarioSelect() {
  DATA.scenarios.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.scenario;
    opt.textContent = s.scenario_label;
    scenarioSelect.appendChild(opt);
  });
}

function renderCancerList() {
  const q = searchCancer.value.trim().toUpperCase();
  cancerList.innerHTML = "";

  DATA.cancers.filter(c => c.includes(q)).forEach(c => {
    const lab = document.createElement("label");
    lab.className = "cancer-item";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selectedCancers.has(c);
    cb.addEventListener("change", () => {
      if (cb.checked) selectedCancers.add(c);
      else selectedCancers.delete(c);
      updatePlot();
    });

    const sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.background = DATA.colors[c] || "#444";

    const txt = document.createElement("span");
    txt.textContent = c;

    lab.appendChild(cb);
    lab.appendChild(sw);
    lab.appendChild(txt);
    cancerList.appendChild(lab);
  });
}

function rowsFor(scenario, cancer) {
  return DATA.curves
    .filter(r => r.scenario === scenario && r.cancer === cancer)
    .sort((a, b) => (+a.x_index) - (+b.x_index));
}

function updatePlot() {
  const scenario = scenarioSelect.value;
  const meta = scenarioById(scenario);
  const traces = [];
  const selected = DATA.cancers.filter(c => selectedCancers.has(c));

  selected.forEach(c => {
    const rows = rowsFor(scenario, c);
    if (rows.length < 2) return;

    traces.push({
      x: rows.map(r => +r.x_index),
      y: rows.map(r => +r.display_delta_ibs),
      customdata: rows.map(r => [r.delta_ibs, r.regime, r.ibs_mean, r.n_folds, r.is_interpolated]),
      type: "scatter",
      mode: "lines+markers",
      name: c,
      legendgroup: c,
      connectgaps: true,
      line: {color: DATA.colors[c] || "#444", width: 1.45},
      marker: {size: 4.6, color: DATA.colors[c] || "#444"},
      opacity: 0.88,
      hovertemplate:
        "<b>" + c + "</b>" +
        "<br>ΔIBS=%{customdata[0]:.4f}" +
        "<br>IBS=%{customdata[2]:.4f}" +
        "<br>regime=%{customdata[1]}" +
        "<br>folds=%{customdata[3]}" +
        "<br>line-filled=%{customdata[4]}" +
        "<extra></extra>"
    });
  });

  const yaxis = {
    title: {text: "ΔIBS vs single-cancer TCGA", font: {size: 20}},
    gridcolor: "rgba(0,0,0,0.075)",
    zeroline: false,
    tickfont: {size: 15},
    range: meta.y_range || undefined
  };

  if (meta.y_tickvals && meta.y_ticktext) {
    yaxis.tickmode = "array";
    yaxis.tickvals = meta.y_tickvals;
    yaxis.ticktext = meta.y_ticktext;
  }

  const annotations = [
    {
      text: "Lower is better",
      xref: "paper",
      yref: "paper",
      x: -0.075,
      y: 0.16,
      showarrow: false,
      textangle: -90,
      font: {size: 13, color: "#555"}
    },
    {
      xref: "paper",
      yref: "paper",
      x: -0.078,
      y: 0.02,
      axref: "paper",
      ayref: "paper",
      ax: -0.078,
      ay: 0.29,
      showarrow: true,
      arrowhead: 2,
      arrowsize: 0.9,
      arrowwidth: 1.4,
      arrowcolor: "#555",
      text: ""
    }
  ];

  const layout = {
    title: {
      text: meta.scenario_label,
      x: 0.5,
      xanchor: "center",
      font: {size: 24, family: "Arial, Helvetica, sans-serif"}
    },
    paper_bgcolor: "#ffffff",
    plot_bgcolor: "#ffffff",
    margin: {l: 108, r: 25, t: 56, b: 205},
    hovermode: "closest",
    xaxis: {
      title: {text: meta.x_axis_title, font: {size: 20}},
      tickmode: "array",
      tickvals: meta.tickvals,
      ticktext: meta.ticktext,
      tickfont: {size: 15},
      gridcolor: "rgba(0,0,0,0.075)",
      zeroline: false
    },
    yaxis: yaxis,
    shapes: [{
      type: "line",
      xref: "paper",
      x0: 0,
      x1: 1,
      yref: "y",
      y0: 0,
      y1: 0,
      line: {color: "rgba(80,80,80,0.8)", width: 1.25, dash: "dash"}
    }],
    annotations: annotations,
    legend: {
      orientation: "h",
      x: 0.5,
      y: -0.22,
      xanchor: "center",
      yanchor: "top",
      font: {size: 12},
      traceorder: "normal",
      itemsizing: "constant"
    }
  };

  Plotly.react("plot", traces, layout, {
    responsive: true,
    displaylogo: false,
    scrollZoom: true
  });
}

scenarioSelect.addEventListener("change", updatePlot);
searchCancer.addEventListener("input", renderCancerList);

document.getElementById("selectAll").addEventListener("click", () => {
  selectedCancers = new Set(DATA.cancers);
  renderCancerList();
  updatePlot();
});

document.getElementById("clearAll").addEventListener("click", () => {
  selectedCancers = new Set();
  renderCancerList();
  updatePlot();
});

document.getElementById("focusFour").addEventListener("click", () => {
  selectedCancers = new Set(DATA.cancers.filter(c => DEFAULT_FOCUS.has(c)));
  renderCancerList();
  updatePlot();
});

initScenarioSelect();
renderCancerList();
updatePlot();
</script>
</body>
</html>
